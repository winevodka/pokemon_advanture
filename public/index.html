<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bim Bim Bn</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="menu-body">
  <div class="menu-screen">
    <header class="menu-header">
      <div class="menu-header-text">
        <h1 class="game-logo">⚡ Bim Bim Bn ⚡</h1>
        <p class="game-subtitle">Học mà chơi — Chơi mà học!</p>
      </div>
      <div class="menu-header-actions">
        <button id="btnSettings" class="btn btn-icon" title="Cài đặt">⚙️</button>
        <button id="btnExit" class="btn btn-icon" title="Thoát">🚪</button>
      </div>
    </header>

    <div class="game-grid">
      <button class="game-card card-color-1" data-href="game.html">
        <span class="game-card-icon">🗺️</span>
        <span class="game-card-title">Phiêu lưu bản đồ</span>
      </button>
      <button class="game-card card-color-2" data-href="game2.html">
        <span class="game-card-icon">🧩</span>
        <span class="game-card-title">Nối hình</span>
      </button>
      <button class="game-card card-color-3" data-href="game3.html">
        <span class="game-card-icon">🔍</span>
        <span class="game-card-title">Tìm số còn thiếu</span>
      </button>
      <button class="game-card card-color-4" data-href="game4.html">
        <span class="game-card-icon">⚖️</span>
        <span class="game-card-title">So sánh</span>
      </button>
      <button class="game-card card-color-5" data-href="game5.html">
        <span class="game-card-icon">🦊</span>
        <span class="game-card-title">Tính với con vật</span>
      </button>
      <button class="game-card card-color-6" data-href="game6.html">
        <span class="game-card-icon">🔢</span>
        <span class="game-card-title">Điền số còn thiếu</span>
      </button>
    </div>

    <p class="game-credit">Made by Bố Bim</p>
    <a href="admin.html" class="admin-link">Question Bank Admin</a>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h2>Settings</h2>
      <label class="setting-row">
        <span>Background Music</span>
        <input type="checkbox" id="musicToggle" />
      </label>
      <button id="closeSettings" class="btn btn-primary">Close</button>
    </div>
  </div>

  <script type="module" src="js/menu.js"></script>
</body>
</html>
