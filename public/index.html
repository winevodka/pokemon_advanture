<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bim Bim Bn</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="menu-body">
  <div class="menu-screen">
    <h1 class="game-logo">⚡ Bim Bim Bn ⚡</h1>
    <p class="game-subtitle">Học mà chơi — Chơi mà học!</p>
    <p class="game-credit">Made by Bố Bim</p>
    <div class="menu-buttons">
      <button id="btnStart" class="btn btn-primary">🗺️ Game 1: Phiêu lưu bản đồ</button>
      <button id="btnGame2" class="btn btn-primary">🧩 Game 2: Nối hình</button>
      <button id="btnGame3" class="btn btn-primary">🔍 Game 3: Tìm số còn thiếu</button>
      <button id="btnGame4" class="btn btn-primary">⚖️ Game 4: So sánh</button>
      <button id="btnSettings" class="btn btn-secondary">Settings</button>
      <button id="btnExit" class="btn btn-danger">Exit</button>
    </div>
    <a href="admin.html" class="admin-link">Question Bank Admin</a>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h2>Settings</h2>
      <label class="setting-row">
        <span>Background Music</span>
        <input type="checkbox" id="musicToggle" />
      </label>
      <button id="closeSettings" class="btn btn-primary">Close</button>
    </div>
  </div>

  <script type="module" src="js/menu.js"></script>
</body>
</html>
