<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bim Bim Bn — So Sánh</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="game-body">
  <header class="hud">
    <div class="hud-item">Đã giải: <span id="game4Progress">0/8</span></div>
    <div class="hud-actions">
      <button id="btnMusicToggle4" class="btn btn-icon" title="Toggle music">🔊</button>
      <button id="btnRestart4" class="btn btn-secondary">Chơi lại</button>
      <a href="index.html" class="btn btn-secondary">Menu</a>
    </div>
  </header>

  <main class="game4-wrapper">
    <h2 class="game4-title">⚖️ So Sánh Lớn Hơn - Bé Hơn - Bằng Nhau!</h2>

    <div id="game4QuestionBoard" class="game4-question-board"></div>

    <div id="game4Options" class="game4-options"></div>

    <div id="game4Feedback" class="quiz-result hidden"></div>
  </main>

  <div id="win4Modal" class="modal hidden">
    <div class="modal-card win-card">
      <h2>🎉 Hoàn thành!</h2>
      <p>Bạn đã so sánh đúng tất cả!</p>
      <div class="form-actions">
        <button id="win4Restart" class="btn btn-primary">Chơi lại</button>
        <a href="index.html" class="btn btn-secondary">Về Menu</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/game4.js"></script>
</body>
</html>
